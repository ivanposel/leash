[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded"
version = "0.1.0"
description = "Give small local LLMs the discipline to look, think, act, and verify — so they never act blind."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "agents", "ollama", "local-llm", "automation", "verification", "grounding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []   # standard library only

[project.urls]
Homepage = "https://github.com/ivanposel/grounded"
Issues = "https://github.com/ivanposel/grounded/issues"

[tool.hatch.build.targets.wheel]
packages = ["grounded"]
